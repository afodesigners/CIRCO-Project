<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIRCO Landing Page</title>
<style>
  :root { --bg: #121212; --ink: #FFF6F0; --muted: #bdb6b0; --red: #FF382E; --line: #2a2a2a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; padding: 64px 16px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 900; text-transform: uppercase; letter-spacing: -.04em; line-height: .94; }
  h1 span { color: var(--red); }
  p { color: var(--muted); margin: 16px 0 40px; }
  a { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; font-weight: 600; }
  a:hover { color: var(--red); }
  small { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>CIRCO<span>.</span></h1>
  <p>Landing page design files.</p>
  <a href="/circo-figma-keyframes-2-cylinder">Option 2: Cylinder keyframes <small>1440px, for Figma import</small></a>
</main>
</body>
</html>
